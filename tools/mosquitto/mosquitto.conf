# Mosquitto for testing the control link on the local network.
# See docs/control-link-mqtt.md.
#
#   brew install mosquitto
#   mosquitto -c tools/mosquitto/mosquitto.conf -v
#
# macOS asks once whether to allow incoming connections; allow it, or the iPad and the
# joystick mover cannot reach the broker.
#
# No authentication and no TLS: this is for a trusted home or lab network only.

# Every interface, so the iPad and the mover can connect, not only this Mac.
listener 1883 0.0.0.0
allow_anonymous true

# Nagle's algorithm off. The link sends small messages at 10 Hz and is being used to
# measure latency; batching them would add delay. Mosquitto leaves it on by default.
set_tcp_nodelay true

# Nothing to keep between runs. Retained status is republished by the app on connect.
persistence false

log_type error
log_type warning
log_type notice
log_type information
